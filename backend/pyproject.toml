[project]
name = "mysoc"
version = "2.0.0"
description = "mySOC: network security monitoring, detection and case management"
requires-python = ">=3.12"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S"]
ignore = ["E501", "S101", "S311", "S104", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["mysoc"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
