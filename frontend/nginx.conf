# Serves the console and proxies /api to the API on the same origin, so the
# session cookie can stay SameSite=Strict and no CORS is needed.
server_tokens off;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 8080;
  root /usr/share/nginx/html;
  client_max_body_size 4m;

  # Strict policy: only this origin's scripts, styles, fonts and API.
  # 'unsafe-inline' for styles covers React style attributes only; no inline
  # scripts are allowed.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;   # live updates stream
    proxy_buffering off;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
